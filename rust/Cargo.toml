[package]
name = "duckport-source"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
arrow-array = { version = "58", features = ["ffi"] }
arrow-schema = "58"
open-arrow-access = { version = "0.3.0", default-features = false, features = [
    "blocking",
    "decompression-bz2",
    "decompression-gzip",
    "decompression-lz4",
    "decompression-zstd",
    "format-atif",
    "format-csv",
    "format-json",
    "format-parquet",
    "format-parquet-brotli",
    "format-parquet-gzip",
    "format-parquet-lz4",
    "format-parquet-zstd",
    "format-warc",
    "format-xml",
    "service-dataverse",
    "service-federal-register",
    "service-figshare",
    "service-govinfo",
    "service-gutenberg",
    "service-hathifiles",
    "service-huggingface",
    "service-internet-archive",
    "service-pmc",
    "service-warc",
    "service-zenodo",
] }
opendal = { version = "0.59.2", default-features = false, features = [
    "auto-register-services",
    "http-transport-reqwest",
    "services-fs",
    "services-http",
    "services-s3",
] }
percent-encoding = "2"
tokio = { version = "1", features = ["fs", "net", "rt-multi-thread", "time"] }
url = "2"

[profile.dev]
debug = 0
