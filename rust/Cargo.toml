[package]
name = "duckport-source"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[features]
default = ["format-parquet", "format-csv", "format-json", "format-xml", "format-atif", "format-warc", "service-huggingface", "decompression-gzip", "decompression-bz2", "decompression-lz4", "decompression-zstd"]
format-parquet = ["open-arrow-access/format-parquet", "open-arrow-access/format-parquet-zstd", "open-arrow-access/format-parquet-lz4", "open-arrow-access/format-parquet-gzip", "open-arrow-access/format-parquet-brotli"]
format-csv = ["open-arrow-access/format-csv"]
format-json = ["open-arrow-access/format-json"]
format-xml = ["open-arrow-access/format-xml"]
format-atif = ["open-arrow-access/format-atif"]
format-warc = ["open-arrow-access/format-warc"]
service-huggingface = ["open-arrow-access/service-huggingface"]
decompression-gzip = ["open-arrow-access/decompression-gzip"]
decompression-bz2 = ["open-arrow-access/decompression-bz2"]
decompression-lz4 = ["open-arrow-access/decompression-lz4"]
decompression-zstd = ["open-arrow-access/decompression-zstd"]

[dependencies]
open-arrow-access = { version = "=0.1.0", default-features = false }
opendal = { version = "=0.59.2", default-features = false, features = ["services-fs", "services-http", "services-s3", "http-transport-reqwest", "auto-register-services"] }
arrow-array = { version = "=59.3.0", features = ["ffi"] }
arrow-schema = "=59.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "net", "fs"] }
url = "2"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
