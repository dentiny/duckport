[package]
name = "duckport-source"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]
test = false
doctest = false

[dependencies]
arrow-array = { version = "58", features = ["ffi"] }
arrow-cast = "58"
arrow-schema = "58"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
opendal-http-transport-reqwest = "0.59"
csv-async = { version = "1.3", default-features = false }
futures = "0.3"
open-arrow-access = { version = "0.7.0", default-features = false, features = [
    "blocking",
    "decompression-bz2",
    "decompression-gzip",
    "decompression-lz4",
    "decompression-zstd",
    "format-atif",
    "format-csv",
    "format-json",
    "format-parquet",
    "format-parquet-brotli",
    "format-parquet-gzip",
    "format-parquet-lz4",
    "format-parquet-zstd",
    "format-warc",
    "format-xml",
    "service-arxiv",
    "service-bhl",
    "service-biorxiv",
    "service-courtlistener",
    "service-dataverse",
    "service-doab",
    "service-federal-register",
    "service-figshare",
    "service-govinfo",
    "service-gutenberg",
    "service-hathifiles",
    "service-huggingface",
    "service-internet-archive",
    "service-library-of-congress",
    "service-meca",
    "service-oapen",
    "service-openstax",
    "service-pmc",
    "service-regulations",
    "service-semantic-scholar",
    "service-uspto",
    "service-warc",
    "service-zenodo",
] }
iceberg-catalog-rest = "0.11"
open-arrow-sink-core = { git = "https://github.com/dentiny/open-arrow-sink", rev = "321e58b36b5fdb8fc63499f509e0c49f93a89fdd" }
open-arrow-sink-iceberg = { git = "https://github.com/dentiny/open-arrow-sink", rev = "321e58b36b5fdb8fc63499f509e0c49f93a89fdd" }
open-arrow-sink-lance = { git = "https://github.com/dentiny/open-arrow-sink", rev = "321e58b36b5fdb8fc63499f509e0c49f93a89fdd" }
open-arrow-sink-layer = { git = "https://github.com/dentiny/open-arrow-sink", rev = "321e58b36b5fdb8fc63499f509e0c49f93a89fdd" }
open-arrow-sink-parquet = { git = "https://github.com/dentiny/open-arrow-sink", rev = "321e58b36b5fdb8fc63499f509e0c49f93a89fdd" }
open-arrow-sink-storage = { git = "https://github.com/dentiny/open-arrow-sink", rev = "321e58b36b5fdb8fc63499f509e0c49f93a89fdd" }
opendal = { version = "0.59", default-features = false, features = [
    "auto-register-services",
    "http-transport-reqwest",
    "services-fs",
    "services-http",
    "services-s3",
] }
percent-encoding = "2"
tokio = { version = "1", features = ["fs", "net", "rt-multi-thread", "time"] }
url = "2"

[features]
test-fixtures = []

[profile.dev]
debug = 0

# Match the sink library's temporary pins until OpenDAL publishes retry_delay.
[patch.crates-io]
opendal-core = { git = "https://github.com/dentiny/opendal.git", rev = "2bf4c9cd289f8881289910afcdc239a4192c4421" }
opendal-layer-retry = { git = "https://github.com/dentiny/opendal.git", rev = "2bf4c9cd289f8881289910afcdc239a4192c4421" }
