[package]
name = "duckport-source"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
arrow-array = { version = "58", features = ["ffi"] }
arrow-cast = "58"
arrow-schema = "58"
base64 = "0.22"
csv-async = { version = "1.3", default-features = false }
futures = "0.3"
open-arrow-access = { version = "0.5.0", default-features = false, features = [
    "blocking",
    "decompression-bz2",
    "decompression-gzip",
    "decompression-lz4",
    "decompression-zstd",
    "format-atif",
    "format-csv",
    "format-json",
    "format-parquet",
    "format-parquet-brotli",
    "format-parquet-gzip",
    "format-parquet-lz4",
    "format-parquet-zstd",
    "format-warc",
    "format-xml",
    "service-arxiv",
    "service-bhl",
    "service-biorxiv",
    "service-courtlistener",
    "service-dataverse",
    "service-doab",
    "service-federal-register",
    "service-figshare",
    "service-govinfo",
    "service-gutenberg",
    "service-hathifiles",
    "service-huggingface",
    "service-internet-archive",
    "service-library-of-congress",
    "service-meca",
    "service-oapen",
    "service-openstax",
    "service-pmc",
    "service-regulations",
    "service-semantic-scholar",
    "service-uspto",
    "service-warc",
    "service-zenodo",
] }
iceberg-catalog-rest = "0.11"
open-arrow-sink-core = "0.3.0"
open-arrow-sink-iceberg = "0.3.0"
open-arrow-sink-lance = "0.3.0"
open-arrow-sink-layer = "0.3.0"
open-arrow-sink-parquet = "0.3.0"
open-arrow-sink-storage = "0.3.0"
opendal = { version = "0.59", default-features = false, features = [
    "auto-register-services",
    "http-transport-reqwest",
    "services-fs",
    "services-http",
    "services-s3",
] }
percent-encoding = "2"
tokio = { version = "1", features = ["fs", "net", "rt-multi-thread", "time"] }
url = "2"

[dev-dependencies]
arrow-select = "58"
lance = { version = "14.0", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros"] }

[profile.dev]
debug = 0
